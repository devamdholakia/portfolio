<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Apex architecture</title>
  <desc>A steward console sends an event over WebSocket to a FastAPI server, which runs a Ridge and XGBoost lap-time model and a Monte Carlo engine, then streams results to the pit wall dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4A3A"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6B4A3A"/></marker>
  </defs>
  <rect width="960" height="284" fill="#FBF8F1"/>
  <line x1="230" y1="56" x2="342" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="258.1" y="36" width="58.8" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">WS event</text>
  <line x1="345" y1="228" x2="233" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="252" y="208" width="71" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">WS results</text>
  <line x1="730" y1="56" x2="618" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="655.3" y="36" width="34.4" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">load</text>
  <line x1="830" y1="110" x2="830" y2="91" stroke="#6B4A3A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="836" y="92" width="40.5" height="15" rx="3" fill="#FBF8F1"/><text x="856.25" y="103" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">train</text>
  <line x1="618" y1="228" x2="727" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="637" y="208" width="71" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">radio call</text>
  <rect x="30" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Steward console</text><text x="130" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">triggers rain, safety car</text>
  <rect x="30" y="196" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Pit wall dashboard</text><text x="130" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Next.js, live timing</text>
  <rect x="345" y="24" width="270" height="236" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="480" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2A20">FastAPI server</text><text x="480" y="67" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">WebSocket endpoint</text><circle cx="363" cy="90" r="2.5" fill="#7A4A1E"/><text x="373" y="94" font-size="12" fill="#3B2A20">1. Ridge: circuit base pace</text><circle cx="363" cy="120" r="2.5" fill="#7A4A1E"/><text x="373" y="124" font-size="12" fill="#3B2A20">2. XGBoost: per-lap residual</text><circle cx="363" cy="150" r="2.5" fill="#7A4A1E"/><text x="373" y="154" font-size="12" fill="#3B2A20">3. NumPy Monte Carlo: 10,000 sims</text><circle cx="363" cy="180" r="2.5" fill="#7A4A1E"/><text x="373" y="184" font-size="12" fill="#3B2A20">4. Recommendation + win probability</text>
  <rect x="730" y="24" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Trained models</text><text x="830" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Ridge + XGBoost artifacts</text>
  <rect x="730" y="110" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Historical laps</text><text x="830" y="148" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">10,244 laps, used for</text><text x="830" y="161" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">training</text>
  <rect x="730" y="196" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Language model</text><text x="830" y="234" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">formats the radio call, no</text><text x="830" y="247" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">math</text>
</svg>
