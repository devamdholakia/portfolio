<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Paradise architecture</title>
  <desc>A chest phone, a second phone, and a spoken request feed a laptop coordinator, which drives two wrist controllers and uses Gemini, sidewalk routing, and a live dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4A3A"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6B4A3A"/></marker>
  </defs>
  <rect width="960" height="370" fill="#FBF8F1"/>
  <line x1="230" y1="56" x2="342" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="245.9" y="36" width="83.19999999999999" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">WebRTC video</text>
  <line x1="230" y1="142" x2="342" y2="142" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="245.9" y="122" width="83.19999999999999" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="133" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">GPS location</text>
  <line x1="230" y1="228" x2="342" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="264.2" y="208" width="46.599999999999994" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">speech</text>
  <line x1="615" y1="56" x2="727" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="633.95" y="36" width="77.1" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">WebHID buzz</text>
  <line x1="618" y1="142" x2="727" y2="142" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="633.95" y="122" width="77.1" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="133" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">photo check</text>
  <line x1="618" y1="228" x2="727" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="652.25" y="208" width="40.5" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">route</text>
  <line x1="615" y1="314" x2="727" y2="314" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="640.05" y="294" width="64.9" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="305" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">WebSocket</text>
  <rect x="30" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Chest phone</text><text x="130" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">camera, on-device YOLO</text>
  <rect x="30" y="110" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Second phone</text><text x="130" y="154" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">stands in for the car</text>
  <rect x="30" y="196" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Wearer request</text><text x="130" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">spoken command</text>
  <rect x="345" y="24" width="270" height="322" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="480" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2A20">Laptop coordinator</text><text x="480" y="67" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Node.js</text><circle cx="363" cy="90" r="2.5" fill="#7A4A1E"/><text x="373" y="94" font-size="12" fill="#3B2A20">Object finder: YOLO, 3 of 5 frames</text><circle cx="363" cy="120" r="2.5" fill="#7A4A1E"/><text x="373" y="124" font-size="12" fill="#3B2A20">Car classifier: CLIP features</text><circle cx="363" cy="150" r="2.5" fill="#7A4A1E"/><text x="373" y="154" font-size="12" fill="#3B2A20">Depth model: obstacle layer</text><circle cx="363" cy="180" r="2.5" fill="#7A4A1E"/><text x="373" y="184" font-size="12" fill="#3B2A20">Distance from known object size</text><circle cx="363" cy="210" r="2.5" fill="#7A4A1E"/><text x="373" y="214" font-size="12" fill="#3B2A20">Guidance: left, right, forward, stop</text>
  <rect x="730" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Wrist controllers</text><text x="830" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">left and right haptics</text>
  <rect x="730" y="110" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Gemini API</text><text x="830" y="148" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">request to object, arrival</text><text x="830" y="161" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">photo check</text>
  <rect x="730" y="196" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Sidewalk routing</text><text x="830" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">OSRM on OpenStreetMap</text>
  <rect x="730" y="282" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Live dashboard</text><text x="830" y="326" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">feed, detections, signal</text>
</svg>
