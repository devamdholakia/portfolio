<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 198" width="960" height="198" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Passionfruit architecture</title>
  <desc>A Next.js front end with a Mapbox map calls a FastAPI backend over REST. The backend processes investments, persists to JSON files, and uses the Gemini API for risk analysis.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4A3A"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6B4A3A"/></marker>
  </defs>
  <rect width="960" height="198" fill="#FBF8F1"/>
  <line x1="233" y1="56" x2="342" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="270.3" y="36" width="34.4" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">REST</text>
  <line x1="130" y1="88" x2="130" y2="107" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="136" y="92" width="34.4" height="15" rx="3" fill="#FBF8F1"/><text x="153.2" y="103" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">pins</text>
  <line x1="618" y1="56" x2="727" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="630.9" y="36" width="83.19999999999999" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">read / write</text>
  <line x1="618" y1="142" x2="727" y2="142" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="646.15" y="122" width="52.699999999999996" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="133" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">analyze</text>
  <rect x="30" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Next.js front end</text><text x="130" y="62" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Zustand state, NextAuth</text><text x="130" y="75" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">sign-in</text>
  <rect x="30" y="110" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Mapbox map</text><text x="130" y="154" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">geocoded business pins</text>
  <rect x="345" y="24" width="270" height="150" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="480" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2A20">FastAPI backend</text><circle cx="363" cy="78" r="2.5" fill="#7A4A1E"/><text x="373" y="82" font-size="12" fill="#3B2A20">Businesses and postings</text><circle cx="363" cy="106" r="2.5" fill="#7A4A1E"/><text x="373" y="110" font-size="12" fill="#3B2A20">Investments: process, update funding</text><circle cx="363" cy="134" r="2.5" fill="#7A4A1E"/><text x="373" y="138" font-size="12" fill="#3B2A20">Analytics on request</text>
  <rect x="730" y="24" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">JSON file store</text><text x="830" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">businesses, investments</text>
  <rect x="730" y="110" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Gemini API</text><text x="830" y="154" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">risk analysis for postings</text>
</svg>
