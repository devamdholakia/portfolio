<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" width="960" height="328" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>SAP Archive Decoder pipeline</title>
  <desc>Binary SAP archives are fingerprinted, decompressed, parsed against a schema, and validated in parallel workers, then exported to CSV and JSON, with corrupt records quarantined and reported.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4A3A"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6B4A3A"/></marker>
  </defs>
  <rect width="960" height="328" fill="#FBF8F1"/>
  <rect x="257" y="10" width="696" height="200" rx="10" fill="none" stroke="#6B4A3A" stroke-dasharray="6 5"/><text x="269" y="200" font-size="11" font-weight="600" fill="#6B4A3A">ProcessPoolExecutor: one worker per file</text>
  <line x1="220" y1="56" x2="272" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="465" y1="56" x2="507" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="56" x2="742" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="88" x2="840" y2="121" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="745" y1="156" x2="703" y2="156" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="708.35" y="136" width="28.299999999999997" height="15" rx="3" fill="#FBF8F1"/><text x="722.5" y="147" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">bad</text>
  <line x1="840" y1="188" x2="840" y2="237" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="846" y="207" width="40.5" height="15" rx="3" fill="#FBF8F1"/><text x="866.25" y="218" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">valid</text>
  <rect x="30" y="24" width="190" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="125" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Binary SAP archives</text><text x="125" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">5 files, mixed compression</text>
  <rect x="275" y="24" width="190" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="370" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Fingerprint</text><text x="370" y="62" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">gzip, lz4, or zstandard</text><text x="370" y="75" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">framing</text>
  <rect x="510" y="24" width="190" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="605" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Decompress</text><text x="605" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">matching codec</text>
  <rect x="745" y="24" width="190" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="840" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Schema-driven parser</text><text x="840" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">7 field types, PACKED/BCD</text>
  <rect x="745" y="124" width="190" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="840" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Per-field validators</text><text x="840" y="168" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">type and length checks</text>
  <rect x="510" y="124" width="190" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="605" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Quarantine</text><text x="605" y="168" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">corrupt records, reported</text>
  <rect x="745" y="240" width="190" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="840" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">CSV / JSON export</text><text x="840" y="284" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">value, type, byte length</text>
</svg>
