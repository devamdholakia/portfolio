<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>StudyApp architecture</title>
  <desc>Two React clients exchange WebRTC signaling through a room server that owns the Pomodoro timer and points. The room server runs either as a Node.js WebSocket server or as a Cloudflare Durable Object with persistent storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4A3A"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6B4A3A"/></marker>
  </defs>
  <rect width="960" height="284" fill="#FBF8F1"/>
  <line x1="233" y1="56" x2="342" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="255.05" y="36" width="64.9" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">WebSocket</text>
  <line x1="233" y1="228" x2="342" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="255.05" y="208" width="64.9" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">WebSocket</text>
  <line x1="130" y1="91" x2="130" y2="107" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <line x1="130" y1="177" x2="130" y2="193" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <line x1="615" y1="56" x2="727" y2="56" stroke="#6B4A3A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="646.15" y="36" width="52.699999999999996" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">runs as</text>
  <line x1="615" y1="142" x2="727" y2="142" stroke="#6B4A3A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="646.15" y="122" width="52.699999999999996" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="133" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">runs as</text>
  <line x1="830" y1="174" x2="830" y2="193" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="836" y="178" width="52.699999999999996" height="15" rx="3" fill="#FBF8F1"/><text x="862.35" y="189" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">persist</text>
  <rect x="30" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Peer A</text><text x="130" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">React client</text>
  <rect x="30" y="110" width="200" height="64" rx="8" fill="none" stroke="#3B2A20" stroke-width="1.5" stroke-dasharray="6 5"/><text x="130" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">WebRTC media</text><text x="130" y="154" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">camera and mic, peer to peer</text>
  <rect x="30" y="196" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Peer B</text><text x="130" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">React client</text>
  <rect x="345" y="24" width="270" height="236" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="480" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2A20">Room server</text><text x="480" y="67" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">one room, two peers</text><circle cx="363" cy="90" r="2.5" fill="#7A4A1E"/><text x="373" y="94" font-size="12" fill="#3B2A20">Relays WebRTC signaling</text><circle cx="363" cy="120" r="2.5" fill="#7A4A1E"/><text x="373" y="124" font-size="12" fill="#3B2A20">Owns Pomodoro phase and end time</text><circle cx="363" cy="150" r="2.5" fill="#7A4A1E"/><text x="373" y="154" font-size="12" fill="#3B2A20">Tracks points per participant</text><circle cx="363" cy="180" r="2.5" fill="#7A4A1E"/><text x="373" y="184" font-size="12" fill="#3B2A20">Broadcasts room state</text>
  <rect x="730" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Node.js ws server</text><text x="830" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">backend 1: rooms in memory</text>
  <rect x="730" y="110" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Durable Object</text><text x="830" y="148" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">backend 2: Cloudflare</text><text x="830" y="161" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Worker, one per room</text>
  <rect x="730" y="196" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Durable storage</text><text x="830" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">timer and points</text>
</svg>
