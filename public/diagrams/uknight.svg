<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>uKnight architecture</title>
  <desc>Two student browsers signal through a Spring Boot service on Cloud Run, backed by Redis, PostgreSQL, and Firestore, while media flows peer to peer over WebRTC with a TURN relay fallback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4A3A"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6B4A3A"/></marker>
  </defs>
  <rect width="960" height="284" fill="#FBF8F1"/>
  <line x1="233" y1="56" x2="342" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="252" y="36" width="71" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">STOMP / WS</text>
  <line x1="233" y1="228" x2="342" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="252" y="208" width="71" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">STOMP / WS</text>
  <line x1="130" y1="91" x2="130" y2="107" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <line x1="130" y1="177" x2="130" y2="193" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <line x1="618" y1="56" x2="727" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="630.9" y="36" width="83.19999999999999" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">atomic match</text>
  <line x1="618" y1="142" x2="727" y2="142" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="646.15" y="122" width="52.699999999999996" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="133" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">persist</text>
  <line x1="618" y1="228" x2="727" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="658.35" y="208" width="28.299999999999997" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">OTP</text>
  <rect x="30" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Student A</text><text x="130" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Next.js client on Vercel</text>
  <rect x="30" y="110" width="200" height="64" rx="8" fill="none" stroke="#3B2A20" stroke-width="1.5" stroke-dasharray="6 5"/><text x="130" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">WebRTC media</text><text x="130" y="148" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">peer to peer, TURN relay</text><text x="130" y="161" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">fallback</text>
  <rect x="30" y="196" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Student B</text><text x="130" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Next.js client on Vercel</text>
  <rect x="345" y="24" width="270" height="236" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="480" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2A20">Spring Boot service</text><text x="480" y="67" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Docker on GCP Cloud Run</text><circle cx="363" cy="90" r="2.5" fill="#7A4A1E"/><text x="373" y="94" font-size="12" fill="#3B2A20">.edu email verification</text><circle cx="363" cy="120" r="2.5" fill="#7A4A1E"/><text x="373" y="124" font-size="12" fill="#3B2A20">STOMP signaling over WebSocket</text><circle cx="363" cy="150" r="2.5" fill="#7A4A1E"/><text x="373" y="154" font-size="12" fill="#3B2A20">Matchmaking and skip / requeue</text><circle cx="363" cy="180" r="2.5" fill="#7A4A1E"/><text x="373" y="184" font-size="12" fill="#3B2A20">Stateless: any instance can serve</text>
  <rect x="730" y="24" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Redis</text><text x="830" y="62" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">queue (ZSET + Lua),</text><text x="830" y="75" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">sessions, online count</text>
  <rect x="730" y="110" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">PostgreSQL</text><text x="830" y="154" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">accounts and profiles</text>
  <rect x="730" y="196" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Firestore</text><text x="830" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">verification codes</text>
</svg>
