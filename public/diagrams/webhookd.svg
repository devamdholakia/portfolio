<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>Webhookd architecture</title>
  <desc>A producer posts events to webhookd, which stores delivery state in DynamoDB, queues references on SQS, delivers signed requests to subscribers, dead-letters exhausted deliveries, and exposes metrics to Prometheus.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B4A3A"/></marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#6B4A3A"/></marker>
  </defs>
  <rect width="960" height="370" fill="#FBF8F1"/>
  <line x1="230" y1="56" x2="342" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="270.3" y="36" width="34.4" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">HTTP</text>
  <line x1="345" y1="228" x2="233" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="248.95" y="208" width="77.1" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">signed POST</text>
  <line x1="230" y1="314" x2="342" y2="314" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="264.2" y="294" width="46.599999999999994" height="15" rx="3" fill="#FBF8F1"/><text x="287.5" y="305" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">scrape</text>
  <line x1="618" y1="56" x2="727" y2="56" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="652.25" y="36" width="40.5" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="47" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">state</text>
  <line x1="618" y1="142" x2="727" y2="142" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="624.8" y="122" width="95.39999999999999" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="133" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">enqueue / poll</text>
  <line x1="615" y1="228" x2="727" y2="228" stroke="#6B4A3A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="633.95" y="208" width="77.1" height="15" rx="3" fill="#FBF8F1"/><text x="672.5" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A4A1E">dead-letter</text>
  <rect x="30" y="24" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Producer</text><text x="130" y="68" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">POST /v1/events</text>
  <rect x="30" y="196" width="200" height="64" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Subscriber endpoint</text><text x="130" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">verifies HMAC signature</text>
  <rect x="30" y="282" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="130" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Prometheus</text><text x="130" y="320" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">deliveries, latency, queue</text><text x="130" y="333" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">depth</text>
  <rect x="345" y="24" width="270" height="322" rx="8" fill="#F6EFE4" stroke="#3B2A20" stroke-width="1.5"/><text x="480" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2A20">webhookd</text><text x="480" y="67" text-anchor="middle" font-size="11" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">Spring Boot 3, Java 21</text><circle cx="363" cy="90" r="2.5" fill="#7A4A1E"/><text x="373" y="94" font-size="12" fill="#3B2A20">Ingest: idempotency key, fan-out</text><circle cx="363" cy="120" r="2.5" fill="#7A4A1E"/><text x="373" y="124" font-size="12" fill="#3B2A20">Write PENDING state, then enqueue</text><circle cx="363" cy="150" r="2.5" fill="#7A4A1E"/><text x="373" y="154" font-size="12" fill="#3B2A20">Worker: breaker check, signed POST</text><circle cx="363" cy="180" r="2.5" fill="#7A4A1E"/><text x="373" y="184" font-size="12" fill="#3B2A20">Retry: full-jitter backoff, 7 attempts</text><circle cx="363" cy="210" r="2.5" fill="#7A4A1E"/><text x="373" y="214" font-size="12" fill="#3B2A20">Sweeper: re-enqueue orphans, 30s</text>
  <rect x="730" y="24" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">DynamoDB</text><text x="830" y="62" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">deliveries, idempotency,</text><text x="830" y="75" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">subscriptions, health</text>
  <rect x="730" y="110" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">SQS work queue</text><text x="830" y="148" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">carries {deliveryId}</text><text x="830" y="161" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">references</text>
  <rect x="730" y="196" width="200" height="64" rx="8" fill="#E6D5BF" stroke="#3B2A20" stroke-width="1.5"/><text x="830" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#3B2A20">Dead-letter queue</text><text x="830" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Consolas, monospace" fill="#6B4A3A">exhausted or non-retryable</text>
</svg>
